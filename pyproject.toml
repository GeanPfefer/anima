[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-local-agent-poc"
version = "0.1.0"
description = "POC seguro de agente local via Ollama"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["local_agent"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
