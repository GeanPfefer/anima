<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anima — Web</title>
  <link rel="stylesheet" href="anima-themes.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #root { height: 100vh; }
    *::-webkit-scrollbar { width: 0; height: 0; } * { scrollbar-width: none; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="anima-data.js"></script>
  <script type="text/babel" src="anima-screens.jsx"></script>
  <script type="text/babel" src="anima-graph.jsx"></script>
  <script type="text/babel" src="anima-app.jsx"></script>
  <script type="text/babel" src="anima-views.jsx"></script>
  <script type="text/babel" src="anima-views2.jsx"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const ChatView = window.AnimaAtoms.ChatView;
    const HomeView = window.AnimaViews.HomeView;
    const GraphView = window.AnimaViews.GraphView;
    const IdentityView = window.AnimaViews.IdentityView;
    const { QuestsView, NotesView, HistoryView, ReportsView } = window.AnimaViews2;

    const NAV = [
      { id: 'home',     label: 'Início',     icon: 'M3 9.5L10 4l7 5.5V17a1 1 0 0 1-1 1h-3v-5H7v5H4a1 1 0 0 1-1-1z' },
      { id: 'chat',     label: 'Chat',       icon: 'M4 4h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H8l-4 3z' },
      { id: 'graph',    label: 'Grafo',      icon: 'M6 6.5a2 2 0 1 0 .01 0M14 5a2 2 0 1 0 .01 0M14.5 14a2 2 0 1 0 .01 0M7.4 7.6l5 4.6M12.8 6.6l-5 5.4' },
      { id: 'quests',   label: 'Quests',     icon: 'M5 17V4M5 4h9l-2.5 3.5L14 11H5' },
      { id: 'history',  label: 'Histórico',  icon: 'M10 5v5l3 2M3 10a7 7 0 1 1 2 5' },
      { id: 'notes',    label: 'Notas',      icon: 'M5 3h7l3 3v11H5zM12 3v3h3' },
      { id: 'reports',  label: 'Relatórios', icon: 'M4 16V9M9 16V4M14 16v-5' },
      { id: 'identity', label: 'Identidade', icon: 'M10 3a3.2 3.2 0 1 0 0 6.4A3.2 3.2 0 0 0 10 3zM4 17c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5' },
    ];

    function Sidebar({ route, setRoute }) {
      const { character } = window.ANIMA;
      return (
        <div style={{ width: 248, flexShrink: 0, height: '100%', borderRight: '1px solid var(--border)', background: 'rgba(255,255,255,0.015)', display: 'flex', flexDirection: 'column', padding: '24px 16px' }}>
          <div style={{ padding: '4px 12px 24px', display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ width: 11, height: 11, borderRadius: '50%', background: 'var(--accent)', boxShadow: 'var(--glow)' }} />
            <span style={{ fontFamily: 'var(--font-display)', fontSize: 22, fontWeight: 600, letterSpacing: '-0.01em', color: 'var(--text)' }}>Anima</span>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2, flex: 1 }}>
            {NAV.map((n) => {
              const active = route === n.id;
              return (
                <button key={n.id} onClick={() => setRoute(n.id)} style={{
                  display: 'flex', alignItems: 'center', gap: 12, padding: '10px 12px', borderRadius: 'var(--r-sm)', border: 'none', cursor: 'pointer',
                  background: active ? 'var(--accent-soft)' : 'transparent', color: active ? 'var(--text)' : 'var(--text-2)', textAlign: 'left', transition: 'all .15s', fontFamily: 'inherit',
                }}>
                  <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke={active ? 'var(--accent-2)' : 'currentColor'} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" style={{ filter: active ? 'drop-shadow(0 0 5px var(--accent))' : 'none' }}><path d={n.icon} /></svg>
                  <span style={{ fontSize: 14, fontWeight: active ? 600 : 500 }}>{n.label}</span>
                </button>
              );
            })}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '10px 12px', borderTop: '1px solid var(--border)', marginTop: 8 }}>
            <div style={{ width: 34, height: 34, borderRadius: '50%', background: 'var(--accent-soft)', border: '1px solid var(--accent-soft)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-display)', fontWeight: 600, color: 'var(--accent-2)' }}>{character.name[0]}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13.5, fontWeight: 600 }}>{character.name}</div>
              <div style={{ fontSize: 11, color: 'var(--text-3)', fontFamily: 'var(--font-mono)' }}>Nv {character.level} · {character.era}</div>
            </div>
          </div>
        </div>
      );
    }

    const Column = ({ children }) => (
      <div style={{ height: '100%', overflowY: 'auto' }}>
        <div style={{ maxWidth: 600, margin: '0 auto', padding: '20px 24px 56px' }}>{children}</div>
      </div>
    );

    function App() {
      const [route, setRoute] = useState(() => { const s = localStorage.getItem('anima.web.route'); return NAV.some((n) => n.id === s) ? s : 'home'; });
      useEffect(() => { localStorage.setItem('anima.web.route', route); }, [route]);
      const mainRef = useRef(null);
      const [dim, setDim] = useState({ w: 900, h: 700 });
      useEffect(() => {
        const el = mainRef.current; if (!el) return;
        const ro = new ResizeObserver(() => { const r = el.getBoundingClientRect(); setDim({ w: Math.round(r.width), h: Math.round(r.height) }); });
        ro.observe(el); return () => ro.disconnect();
      }, []);

      return (
        <div className="thm thm-lumen" style={{ height: '100vh', display: 'flex', background: 'radial-gradient(120% 90% at 70% 0%, #0c0e16 0%, #06070c 70%)' }}>
          <Sidebar route={route} setRoute={setRoute} />
          <div ref={mainRef} style={{ flex: 1, height: '100%', position: 'relative', overflow: 'hidden' }}>
            {route === 'home' && <Column><HomeView /></Column>}
            {route === 'chat' && <div style={{ height: '100%', maxWidth: 800, margin: '0 auto' }}><ChatView /></div>}
            {route === 'graph' && <GraphView w={dim.w} h={dim.h} compact={false} />}
            {route === 'quests' && <Column><QuestsView /></Column>}
            {route === 'history' && <Column><div style={{ padding: '8px 0' }}><div style={{ fontFamily: 'var(--font-display)', fontSize: 24, fontWeight: 600, marginBottom: 18 }}>Histórico</div><HistoryView /></div></Column>}
            {route === 'notes' && <Column><div style={{ padding: '8px 0' }}><div style={{ fontFamily: 'var(--font-display)', fontSize: 24, fontWeight: 600, marginBottom: 18 }}>Notas</div><NotesView /></div></Column>}
            {route === 'reports' && <Column><div style={{ padding: '8px 0' }}><ReportsView /></div></Column>}
            {route === 'identity' && <Column><IdentityView /></Column>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
