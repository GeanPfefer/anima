<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anima — Protótipo</title>
  <link rel="stylesheet" href="anima-themes.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: radial-gradient(120% 90% at 50% 0%, #0c0e16 0%, #06070c 70%); overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
    #root { height: 100vh; display: flex; align-items: center; justify-content: center; }
    *::-webkit-scrollbar { width: 0; height: 0; }
    * { scrollbar-width: none; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="anima-data.js"></script>
  <script type="text/babel" src="anima-screens.jsx"></script>
  <script type="text/babel" src="anima-graph.jsx"></script>
  <script type="text/babel" src="anima-app.jsx"></script>
  <script type="text/babel" src="anima-views.jsx"></script>
  <script type="text/babel" src="anima-views2.jsx"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React; // eslint-disable-line
    const W = 384, H = 824, SB = 36, NAV = 66;
    const GW = W, GH = H - SB - NAV;
    const { ChatView } = window.AnimaAtoms;
    const { HomeView } = window.AnimaViews;
    const { QuestsView, DiarioView, VoceView } = window.AnimaViews2;

    const NAVI = [
      { id: 'home',   label: 'Início', icon: 'M3 9.5L10 4l7 5.5V17a1 1 0 0 1-1 1h-3v-5H7v5H4a1 1 0 0 1-1-1z' },
      { id: 'quests', label: 'Quests', icon: 'M5 17V4M5 4h9l-2.5 3.5L14 11H5' },
      { id: 'chat',   label: 'Chat',   icon: 'M4 4h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H8l-4 3z' },
      { id: 'diario', label: 'Diário', icon: 'M4 4.5A1.5 1.5 0 0 1 5.5 3H16v12H5.5A1.5 1.5 0 0 0 4 16.5zM4 16.5V4.5' },
      { id: 'voce',   label: 'Você',   icon: 'M10 3a3.2 3.2 0 1 0 0 6.4A3.2 3.2 0 0 0 10 3zM4 17c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5' },
    ];

    function StatusBar() {
      return (
        <div style={{ height: SB, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 24px', fontSize: 13, fontWeight: 600, color: 'var(--text)', fontFamily: 'var(--font-mono)', flexShrink: 0 }}>
          <span>9:41</span>
          <span style={{ display: 'flex', gap: 5, alignItems: 'center', opacity: 0.85 }}>
            <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="3.5" width="3" height="7.5" rx="1"/><rect x="9" y="1.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1" opacity="0.4"/></svg>
            <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x="0.5" y="0.5" width="18" height="10" rx="2.5" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="13" height="7" rx="1.2" fill="currentColor"/><rect x="19.5" y="3.5" width="1.5" height="4" rx="0.75" fill="currentColor" opacity="0.5"/></svg>
          </span>
        </div>
      );
    }

    function Nav({ tab, setTab }) {
      return (
        <div style={{ height: NAV, flexShrink: 0, borderTop: '1px solid var(--border)', display: 'flex', alignItems: 'stretch', padding: '0 8px 8px', background: 'rgba(8,10,16,0.6)', backdropFilter: 'blur(12px)' }}>
          {NAVI.map((n) => {
            const active = tab === n.id;
            return (
              <button key={n.id} onClick={() => setTab(n.id)} style={{ flex: 1, border: 'none', background: 'transparent', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 4, color: active ? 'var(--accent-2)' : 'var(--text-3)', transition: 'color .15s' }}>
                <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" style={{ filter: active ? 'drop-shadow(0 0 6px var(--accent))' : 'none' }}><path d={n.icon} /></svg>
                <span style={{ fontSize: 10, fontWeight: active ? 600 : 500 }}>{n.label}</span>
              </button>
            );
          })}
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState(() => { const s = localStorage.getItem('anima.tab'); return NAVI.some((n) => n.id === s) ? s : 'chat'; });
      const [scale, setScale] = useState(1);
      useEffect(() => { localStorage.setItem('anima.tab', tab); }, [tab]);
      useEffect(() => {
        const fit = () => setScale(Math.min(1, (window.innerHeight - 28) / H, (window.innerWidth - 28) / W));
        fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit);
      }, []);

      const scroll = { height: '100%', overflowY: 'auto', WebkitOverflowScrolling: 'touch' };
      return (
        <div className="thm thm-lumen" style={{ width: W, height: H, transform: `scale(${scale})`, transformOrigin: 'center', borderRadius: 42, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.08)', boxShadow: '0 40px 120px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03)', display: 'flex', flexDirection: 'column', position: 'relative' }}>
          <StatusBar />
          <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>
            {tab === 'chat' && <ChatView />}
            {tab === 'home' && <div style={scroll}><HomeView /></div>}
            {tab === 'quests' && <div style={scroll}><QuestsView /></div>}
            {tab === 'diario' && <div style={scroll}><DiarioView /></div>}
            {tab === 'voce' && <div style={{ height: '100%' }}><VoceView gw={GW} gh={GH} /></div>}
          </div>
          <Nav tab={tab} setTab={setTab} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
